aid: k-health
name: K Health
description: 'K Health is a clinical AI and virtual primary care company founded in 2016 and headquartered
  in New York City. Its platform pairs an AI-led symptom investigation and intake engine with a 24/7 team
  of credentialed clinicians to deliver primary care, urgent care, mental health, and medical weight
  management. K Health licenses its clinical AI to health systems — including Cedars-Sinai, Mayo Clinic,
  Hackensack Meridian Health, Hartford HealthCare, Mass General Brigham, and Northwell Health — where it
  triages patients, combines intake with EMR data (Epic/MyChart), and automates clinical documentation.
  The company has raised more than $380M and was valued at roughly $900M as of 2024. K Health is a B2B2C
  consumer health application with no public developer API; integrations are handled through partners
  such as Health Gorilla for lab ordering. This profile was surfaced as a ggv-capital portfolio lead and
  enriched with verified public identity, link, and domain-security signals.'
